<div class="screen fade-in decorated-screen" id="character-select-screen">
    <div class="screen-content" style="min-width: 700px;">
        <h1 class="screen-title">ВЫБОР ПЕРСОНАЖА</h1>
        <p class="screen-subtitle">Выберите вашего искателя приключений</p>

        <div class="divider"></div>

        <!-- Character list -->
        <div class="character-list" id="character-list">
            <p style="color: var(--color-text-hint); text-align: center;">
                Загрузка персонажей...
            </p>
        </div>

        <div class="divider"></div>

        <!-- Action buttons -->
        <div class="button-group button-group-horizontal">
            <button class="bg1-button bg1-button-primary" id="btn-select" disabled>
                ВЫБРАТЬ
            </button>

            <button class="bg1-button" id="btn-create">
                СОЗДАТЬ НОВОГО
            </button>

            <button class="bg1-button" id="btn-back">

            </button>
        </div>
    </div>
</div>
