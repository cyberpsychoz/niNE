<!-- Rest Dialog - modal overlay (triggered by server event) -->
<div id="rest-dialog" class="panel-overlay hidden">
    <div class="panel-container panel-narrow rest-dialog-container">
        <!-- Header -->
        <div class="panel-header">
            <span class="panel-title" id="rest-title">Отдых</span>
        </div>

        <div class="panel-body rest-body">
            <!-- HP Status -->
            <div class="rest-hp-section">
                <div class="rest-hp-label">Очки здоровья</div>
                <div class="rest-hp-bar-container">
                    <div class="rest-hp-bar">
                        <div class="rest-hp-fill" id="rest-hp-fill"></div>
                    </div>
                    <span class="rest-hp-text" id="rest-hp-text">0 / 0</span>
                </div>
            </div>

            <!-- Hit Dice Status -->
            <div class="rest-hitdice-section">
                <div class="rest-hitdice-label">Кости хитов</div>
                <span class="rest-hitdice-value" id="rest-hitdice-text">0 / 0</span>
            </div>

            <!-- Description -->
            <div class="rest-description" id="rest-description"></div>

            <!-- Result Message -->
            <div class="rest-result hidden" id="rest-result"></div>

            <!-- Actions -->
            <div class="rest-actions">
                <button class="btn btn-secondary" id="rest-spend-hitdie">Потратить кость хитов</button>
                <button class="btn btn-primary" id="rest-finish">Завершить отдых</button>
            </div>
        </div>
    </div>
</div>
