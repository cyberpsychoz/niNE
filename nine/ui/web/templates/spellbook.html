<!-- Spellbook Panel - persistent overlay -->
<div id="spellbook-panel" class="panel-overlay hidden">
    <div class="panel-container panel-wide">
        <!-- Header -->
        <div class="panel-header">
            <span class="panel-title">Книга заклинаний</span>
            <button class="panel-close-btn" id="sb-close-btn">&times;</button>
        </div>

        <!-- Spell Slots Bar -->
        <div class="sb-slots-bar" id="sb-slots-bar">
            <!-- Filled by JS: levels 1-9 -->
        </div>

        <!-- Filter Buttons -->
        <div class="sb-filters" id="sb-filters">
            <button class="sb-filter-btn active" data-filter="all">Все</button>
            <button class="sb-filter-btn" data-filter="cantrip">Заговоры</button>
            <button class="sb-filter-btn" data-filter="prepared">Подготовленные</button>
        </div>

        <!-- Two-column layout -->
        <div class="sb-content">
            <!-- Left: Spell List -->
            <div class="sb-spell-list" id="sb-spell-list">
                <div class="sb-empty-message">Нет заклинаний</div>
            </div>

            <!-- Right: Spell Details -->
            <div class="sb-spell-detail" id="sb-spell-detail">
                <div class="sb-detail-placeholder">Выберите заклинание</div>
            </div>
        </div>
    </div>
</div>
