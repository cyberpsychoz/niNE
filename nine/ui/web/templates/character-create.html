<div class="screen fade-in" id="character-create-screen">
    <div class="screen-content" style="min-width: 780px; max-width: 900px;">
        <h1 class="screen-title">CREATE CHARACTER</h1>
        <p class="screen-subtitle">D&D 5e Character Creation</p>

        <div class="divider"></div>

        <!-- Step indicator -->
        <div class="wizard-steps" id="wizard-steps"></div>

        <!-- Wizard content (rendered dynamically per step) -->
        <div class="wizard-content" id="wizard-content"></div>

        <div class="divider"></div>

        <!-- Navigation -->
        <div class="wizard-nav">
            <button class="bg1-button" id="btn-wizard-back">BACK</button>
            <button class="bg1-button" id="btn-wizard-cancel">CANCEL</button>
            <button class="bg1-button bg1-button-primary" id="btn-wizard-next">NEXT</button>
        </div>
    </div>
</div>
