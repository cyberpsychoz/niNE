<!-- Chat Window - Two modes: closed (temporary messages) and open (history + input) -->
<div id="chat-window">
    <!-- Temporary messages (closed mode) -->
    <div class="chat-temp-messages" id="chat-temp-messages"></div>

    <!-- Full chat (open mode) -->
    <div class="chat-full" id="chat-full" style="display: none;">
        <!-- History scrollable area -->
        <div class="chat-history" id="chat-history">
            <div class="chat-history-content" id="chat-history-content"></div>
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
            <input
                type="text"
                id="chat-input"
                class="chat-input"
                placeholder="Press T to chat..."
                maxlength="512"
                autocomplete="off"
            />
            <div class="chat-hint">ESC to close | Tab for commands</div>
        </div>

        <!-- Command suggestions -->
        <div class="chat-suggestions" id="chat-suggestions" style="display: none;">
            <div class="chat-suggestions-content" id="chat-suggestions-content"></div>
        </div>
    </div>
</div>
